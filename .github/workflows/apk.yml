name: ZIP to APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Unzip & Fix Code
        run: |
          unzip -o "*.zip"
          printf "android.useAndroidX=true\norg.gradle.jvmargs=-Xmx2048m\n" > gradle.properties
          sed -i 's/"To $contact: "$message"""/"To $contact: \\"$message\\""/g' app/src/main/java/com/google/android/nanolauncher/model/NanoIntent.kt
          sed -i 's|@mipmap/ic_launcher_round|@android:drawable/sym_def_app_icon|g; s|@mipmap/ic_launcher|@android:drawable/sym_def_app_icon|g; s|@style/Theme.DeviceDefault.NoActionBar|@android:style/Theme.DeviceDefault.NoActionBar|g' app/src/main/AndroidManifest.xml
      - uses: gradle/actions/setup-gradle@v4
      - run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: APK-Download
          path: app/build/outputs/apk/debug/app-debug.apk
          
